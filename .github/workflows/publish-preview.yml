name: Render and Publish PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        id: render
        continue-on-error: true
        run: quarto render

      - name: Upload PR preview as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-book-${{ github.event.pull_request.number }}
          path: ./_site/

      - name: Deploy PR preview to GitHub Pages
        if: steps.render.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          destination_dir: pr-${{ github.event.pull_request.number }}
          user_name: "GitHub Actions [Bot]"
          user_email: "actions@github.com"

      - name: Comment PR with preview URL
        if: steps.render.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${pr}/`;

            github.rest.issues.createComment({
              issue_number: pr,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📘 **Preview available**\n\n👉 ${url}`
            });

      - name: Fail job if render failed
        if: steps.render.outcome != 'success'
        run: |
          echo "'quarto render' failed. Please check the log."
          exit 1
